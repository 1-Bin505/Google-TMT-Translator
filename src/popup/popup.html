<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TMT Translation</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════
       MAIN VIEW
  ═══════════════════════════════════════ -->
  <div id="view-main" class="view">

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <span class="header-logo" aria-hidden="true">⟺</span>
        <span class="header-title">TMT Translation</span>
      </div>
      <div class="header-actions">
        <!-- Reading Mode toggle switch -->
        <div class="rm-toggle-wrap" title="Reading Mode">
          <span class="rm-toggle-label">Read</span>
          <label class="toggle-switch" aria-label="Toggle Reading Mode">
            <input type="checkbox" id="chk-reading-mode" />
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
          </label>
        </div>
        <!-- Settings -->
        <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Open settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" fill="currentColor"/>
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M6.56 1.44a.75.75 0 0 1 .72-.56h1.44a.75.75 0 0 1 .72.56l.19.74a4.5 4.5 0 0 1 .74.43l.72-.24a.75.75 0 0 1 .9.36l.72 1.24a.75.75 0 0 1-.17.95l-.59.49v.86l.59.49c.29.24.37.63.17.95l-.72 1.24a.75.75 0 0 1-.9.36l-.72-.24a4.5 4.5 0 0 1-.74.43l-.19.74a.75.75 0 0 1-.72.56H7.28a.75.75 0 0 1-.72-.56l-.19-.74a4.5 4.5 0 0 1-.74-.43l-.72.24a.75.75 0 0 1-.9-.36l-.72-1.24a.75.75 0 0 1 .17-.95l.59-.49v-.86l-.59-.49a.75.75 0 0 1-.17-.95l.72-1.24a.75.75 0 0 1 .9-.36l.72.24a4.5 4.5 0 0 1 .74-.43l.19-.74zM8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"
              fill="currentColor" opacity="0.6"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── NORMAL MODE ── -->
    <div id="normal-mode">

      <!-- Language Bar -->
      <div class="lang-bar">
        <div class="lang-select-wrap">
          <select id="sel-src" class="lang-select" aria-label="Source language">
            <option value="en">English</option>
            <option value="ne">Nepali</option>
            <option value="tmg">Tamang</option>
          </select>
        </div>
        <button class="swap-btn" id="btn-swap" title="Swap languages" aria-label="Swap languages">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 5h10M10 2l3 3-3 3M13 11H3M6 8l-3 3 3 3"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="lang-select-wrap">
          <select id="sel-tgt" class="lang-select" aria-label="Target language">
            <option value="en">English</option>
            <option value="ne" selected>Nepali</option>
            <option value="tmg">Tamang</option>
          </select>
        </div>
      </div>

      <!-- Source Input -->
      <div class="panel source-panel">
        <textarea
          id="input-text"
          class="text-area"
          placeholder="Enter text to translate…"
          rows="4"
          maxlength="2000"
          aria-label="Text to translate"
          spellcheck="true"
        ></textarea>
        <div class="panel-footer">
          <span class="char-count" id="char-count">0 / 2000</span>
          <button class="ghost-btn" id="btn-clear" aria-label="Clear input">Clear</button>
        </div>
      </div>

      <!-- Translate Button -->
      <div class="action-row">
        <button class="translate-btn" id="btn-translate" aria-label="Translate text">
          <span class="btn-label">Translate</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </div>

      <!-- Output Panel -->
      <div class="panel output-panel" id="output-panel" aria-live="polite">
        <div class="output-empty" id="output-empty">
          <span class="output-empty-icon">⟺</span>
          <span>Translation will appear here</span>
        </div>
        <div class="output-error" id="output-error" hidden>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="6.25" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 4v3.5M7 9.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span id="output-error-msg"></span>
        </div>
        <div class="output-result" id="output-result" hidden>
          <p class="output-text" id="output-text"></p>
          <div class="output-actions">
            <button class="ghost-btn small" id="btn-copy" aria-label="Copy translation">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M9 4V2.5A1.5 1.5 0 0 0 7.5 1H2.5A1.5 1.5 0 0 0 1 2.5v5A1.5 1.5 0 0 0 2.5 9H4"
                      stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              Copy
            </button>
          </div>
        </div>
      </div>

    </div><!-- /normal-mode -->

    <!-- ── READING MODE ── -->
    <div id="reading-mode" hidden>

      <!-- Reading mode lang row -->
      <div class="lang-bar">
        <span class="rm-lang-label">Translate to</span>
        <div class="lang-select-wrap" style="flex:1">
          <select id="rm-sel-tgt" class="lang-select" aria-label="Reading mode target language">
            <option value="en">English</option>
            <option value="ne" selected>Nepali</option>
            <option value="tmg">Tamang</option>
          </select>
        </div>
      </div>

      <!-- Two action buttons -->
      <div class="rm-actions">

        <button class="rm-btn" id="btn-rm-selection">
          <span class="rm-btn-icon">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
              <rect x="2" y="4"  width="18" height="2.5" rx="1.2" fill="currentColor" opacity="0.18"/>
              <rect x="2" y="9"  width="13" height="2.5" rx="1.2" fill="currentColor" opacity="0.5"/>
              <rect x="2" y="14" width="10" height="2.5" rx="1.2" fill="currentColor" opacity="0.18"/>
              <circle cx="17" cy="15.5" r="4" fill="var(--accent)" opacity="0.12"/>
              <path d="M15 15.5h4M17 13.5v4" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="rm-btn-body">
            <span class="rm-btn-title">Translate Selection</span>
            <span class="rm-btn-desc">Translates the text you have highlighted on the page</span>
          </span>
          <span class="rm-btn-spinner" aria-hidden="true"></span>
        </button>

        <button class="rm-btn" id="btn-rm-page">
          <span class="rm-btn-icon">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.4" opacity="0.35"/>
              <rect x="5" y="6"  width="12" height="2" rx="1" fill="currentColor" opacity="0.45"/>
              <rect x="5" y="10" width="12" height="2" rx="1" fill="currentColor" opacity="0.3"/>
              <rect x="5" y="14" width="8"  height="2" rx="1" fill="currentColor" opacity="0.18"/>
              <circle cx="17" cy="16" r="4" fill="var(--accent)" opacity="0.12"/>
              <path d="M15.3 16l1.1 1.3 2.3-2.3" stroke="var(--accent)" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="rm-btn-body">
            <span class="rm-btn-title">Translate Page</span>
            <span class="rm-btn-desc">Replaces all visible text on this page with the translation</span>
          </span>
          <span class="rm-btn-spinner" aria-hidden="true"></span>
        </button>

      </div>

      <!-- Reading mode status area -->
      <div id="rm-status" class="rm-status" hidden>
        <div id="rm-status-error" class="rm-status-error" hidden>
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="5.75" stroke="currentColor" stroke-width="1.4"/>
            <path d="M6.5 3.5v3M6.5 8.5v.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span id="rm-error-msg"></span>
        </div>
        <div id="rm-status-success" class="rm-status-success" hidden>
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
            <path d="M2 7l3 3 6-6" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="rm-success-msg"></span>
        </div>
        <div id="rm-result-box" class="rm-result-box" hidden>
          <p id="rm-result-text"></p>
          <div class="output-actions">
            <button class="ghost-btn small" id="rm-btn-copy" aria-label="Copy translation">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M9 4V2.5A1.5 1.5 0 0 0 7.5 1H2.5A1.5 1.5 0 0 0 1 2.5v5A1.5 1.5 0 0 0 2.5 9H4"
                      stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              Copy
            </button>
          </div>
        </div>
      </div>

    </div><!-- /reading-mode -->

    <!-- No-API-key banner -->
    <div class="no-key-banner" id="no-key-banner" hidden>
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
        <circle cx="6.5" cy="6.5" r="5.75" stroke="currentColor" stroke-width="1.5"/>
        <path d="M6.5 3.5v3.25M6.5 8.75v.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      API key not set.
      <button class="inline-link" id="banner-settings-link">Add key in Settings</button>
    </div>

  </div><!-- /view-main -->


  <!-- ═══════════════════════════════════════
       SETTINGS VIEW
  ═══════════════════════════════════════ -->
  <div id="view-settings" class="view" hidden>

    <header class="header">
      <button class="icon-btn" id="btn-back" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="header-title">Settings</span>
    </header>

    <div class="settings-body">

      <section class="settings-section">
        <h2 class="settings-label">API Key</h2>
        <p class="settings-hint">
          Stored locally in your browser. Only sent to the TMT API.
        </p>
        <div class="key-input-row">
          <input type="password" id="input-api-key" class="key-input"
                 placeholder="Paste your API key…" autocomplete="off"
                 spellcheck="false" aria-label="API key"/>
          <button class="icon-btn" id="btn-toggle-key" title="Show/hide key"
                  aria-label="Toggle API key visibility">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
              <path d="M1 7.5S3.5 3 7.5 3 14 7.5 14 7.5 11.5 12 7.5 12 1 7.5 1 7.5z"
                    stroke="currentColor" stroke-width="1.3"/>
              <circle cx="7.5" cy="7.5" r="2" stroke="currentColor" stroke-width="1.3"/>
            </svg>
          </button>
        </div>
        <button class="save-btn" id="btn-save-key">Save Key</button>
        <span class="save-status" id="save-status" hidden>✓ Saved</span>
      </section>

      <section class="settings-section">
        <h2 class="settings-label">About</h2>
        <dl class="about-list">
          <dt>Extension</dt><dd>TMT Translation v1.0.0</dd>
          <dt>API Endpoint</dt><dd class="mono">tmt.ilprl.ku.edu.np</dd>
          <dt>Languages</dt><dd>English · Nepali · Tamang</dd>
        </dl>
      </section>

      <section class="settings-section">
        <h2 class="settings-label">Data</h2>
        <button class="ghost-btn danger" id="btn-clear-key">Remove API Key</button>
      </section>

    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
